<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Video — IncuBrix AI B-roll Studio</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
  <link rel="stylesheet" href="/frontend/css/processing.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/frontend/assets/logo.svg" alt="IncuBrix Logo" width="28" height="28">
        <div class="brand-text">
          <span class="brand-name">IncuBrix</span>
          <span class="brand-tagline">AI B-roll Studio</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/create.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Create Video
        </a>
        <a href="/dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          My Projects
        </a>
        <a href="/editor.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Scene Editor
        </a>
        <a href="/results.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Sources & Licences
        </a>
        <a href="/settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <span>v1.0.0 Production</span>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <h1 class="page-title">Job Processing</h1>
        </div>
        <div class="navbar-right">
          <div class="status-badge" id="system-status">
            <span class="status-dot"></span>
            <span>Engine Active</span>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="card processing-card" id="processing-container">
          <div class="processing-header">
            <div class="job-meta-pill">JOB ID: <span id="job-id-text">Loading...</span></div>
            <h2 class="progress-headline" id="current-step-label">Initializing video rendering pipeline...</h2>
            <div style="font-size:2rem; font-weight:800; color:var(--primary);" id="progress-percent-text">0%</div>
          </div>

          <!-- Progress Bar -->
          <div class="progress-track-lg">
            <div class="progress-fill-lg" id="progress-bar-fill" style="width: 0%;"></div>
          </div>

          <div class="processing-metrics-row">
            <div>Elapsed Time: <strong id="elapsed-time-text">00:00</strong></div>
            <div>Pipeline Mode: <strong>Async Background Execution</strong></div>
            <div>Status: <span class="badge badge-warning" id="job-status-pill">Running</span></div>
          </div>

          <!-- 11-Stage Pipeline Steps -->
          <div class="stages-list" id="stages-container">
            <!-- Populated dynamically via JS -->
          </div>

          <div id="error-box" style="display:none; margin-top:20px;"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/frontend/js/app.js"></script>
  <script type="module" src="/frontend/js/processing.js"></script>
</body>
</html>
